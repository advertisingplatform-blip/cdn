<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  svg{
    width:min(60vmin, 460px);
    height:min(60vmin, 460px);
    overflow:visible;
    cursor:pointer;
  }

  #blob{
    transform-origin: 96px 145px;
  }
  .slash{
    transform-box: fill-box;
    transform-origin: center;
  }

  /* ---------- Stare: intrare (o singură dată, la încărcarea paginii) ---------- */
  #logo.enter #blob{
    opacity:0;
    animation: blobIn 1s cubic-bezier(.2,1.6,.4,1) 0.1s forwards;
  }
  #logo.enter .slash{
    opacity:0;
    transform: translate(-18px, 14px) scaleY(0.4);
    animation-fill-mode:forwards;
    animation-timing-function: cubic-bezier(.2,1.4,.3,1);
    animation-duration: 0.7s;
  }
  #logo.enter #slash1{ animation-name: slashIn; animation-delay: 0.9s; }
  #logo.enter #slash2{ animation-name: slashIn; animation-delay: 1.05s; }
  #logo.enter #slash3{ animation-name: slashIn; animation-delay: 1.2s; }

  @keyframes blobIn{
    0%{ opacity:0; transform:scale(0) rotate(-25deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(4deg); }
    80%{ transform:scale(0.96) rotate(-2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes slashIn{
    0%{ opacity:0; transform: translate(-18px, 14px) scaleY(0.3); }
    65%{ opacity:1; transform: translate(2px, -3px) scaleY(1.08); }
    100%{ opacity:1; transform: translate(0,0) scaleY(1); }
  }

  /* ---------- Stare: repaus (formă originală, fixă) ---------- */
  #logo.idle #blob{
    opacity:1;
    transform: scale(1) rotate(0deg);
  }
  #logo.idle #slash1,
  #logo.idle #slash2,
  #logo.idle #slash3{
    opacity:1;
    transform:none;
  }

  /* ---------- Stare: click — bula se umflă, liniile "sar" ca pe un resort ---------- */
  #logo.pulsing #blob{
    animation: blobClickPulse 1s ease-out 1;
  }
  #logo.pulsing #slash1{
    animation: springY1 1.1s cubic-bezier(.36,.07,.19,.97) 1;
  }
  #logo.pulsing #slash2{
    animation: springY2 1.3s cubic-bezier(.36,.07,.19,.97) 1;
  }
  #logo.pulsing #slash3{
    animation: springY3 1.5s cubic-bezier(.36,.07,.19,.97) 1;
  }

  @keyframes blobClickPulse{
    0%   { transform: scale(1); }
    30%  { transform: scale(1.16); }
    50%  { transform: scale(0.94); }
    68%  { transform: scale(1.05); }
    83%  { transform: scale(0.98); }
    100% { transform: scale(1); }
  }

  /* fiecare linie oscilează pe verticală, cu amplitudine/ritm propriu, ca trasă de un resort */
  @keyframes springY1{
    0%   { transform: translateY(0); }
    14%  { transform: translateY(-16px); }
    34%  { transform: translateY(9px); }
    54%  { transform: translateY(-5px); }
    74%  { transform: translateY(2.5px); }
    90%  { transform: translateY(-1px); }
    100% { transform: translateY(0); }
  }
  @keyframes springY2{
    0%   { transform: translateY(0); }
    12%  { transform: translateY(19px); }
    30%  { transform: translateY(-11px); }
    50%  { transform: translateY(6px); }
    68%  { transform: translateY(-3px); }
    84%  { transform: translateY(1.5px); }
    100% { transform: translateY(0); }
  }
  @keyframes springY3{
    0%   { transform: translateY(0); }
    17%  { transform: translateY(-21px); }
    38%  { transform: translateY(12px); }
    58%  { transform: translateY(-6.5px); }
    76%  { transform: translateY(3px); }
    90%  { transform: translateY(-1.5px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<script>
  const logo = document.getElementById('logo');

  // După ce se termină animația de intrare, trecem în starea de repaus (formă fixă, originală)
  setTimeout(() => {
    if (logo.classList.contains('enter')) {
      logo.classList.remove('enter');
      logo.classList.add('idle');
    }
  }, 2000);

  logo.addEventListener('click', () => {
    if (!logo.classList.contains('idle')) return; // ignoră click în timpul intrării sau altui puls activ
    logo.classList.remove('idle');
    logo.classList.add('pulsing');
  });

  logo.addEventListener('animationend', (e) => {
    // cea mai lungă animație din secvența de click este springY3 (pe slash3)
    if (e.animationName === 'springY3') {
      logo.classList.remove('pulsing');
      logo.classList.add('idle');
    }
  });
</script>
