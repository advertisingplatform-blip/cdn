<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>www.moment.ro</title>
<style>
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  svg{
    width:min(60vmin, 460px);
    height:min(60vmin, 460px);
    overflow:visible;
    cursor:pointer;
  }

  /* Grup care conține întregul logo, folosit pentru rotirea la click */
  #logo{
    transform-box: fill-box;
    transform-origin: center;
  }
  #logo.spinning{
    animation: loaderSpin 1.1s cubic-bezier(.55,0,.35,1) 1;
  }

  @keyframes loaderSpin{
    0%   { transform: rotate(0deg)   scale(1, 1); }
    12%  { transform: rotate(110deg) scale(0.82, 1.18); }
    26%  { transform: rotate(240deg) scale(1.18, 0.82); }
    40%  { transform: rotate(380deg) scale(0.85, 1.15); }
    54%  { transform: rotate(520deg) scale(1.15, 0.85); }
    68%  { transform: rotate(630deg) scale(0.92, 1.08); }
    82%  { transform: rotate(695deg) scale(1.08, 0.92); }
    94%  { transform: rotate(715deg) scale(0.97, 1.03); }
    100% { transform: rotate(720deg) scale(1, 1); }
  }

  /* Bula neagră */
  #blob{
    transform-origin: 96px 145px;
    opacity:0;
    transform:scale(0) rotate(-25deg);
    animation: blobIn 1s cubic-bezier(.2,1.6,.4,1) 0.1s forwards,
               float 4.5s ease-in-out 1.3s infinite;
  }

  @keyframes blobIn{
    0%{ opacity:0; transform:scale(0) rotate(-25deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(4deg); }
    80%{ transform:scale(0.96) rotate(-2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(0.6deg); }
  }

  /* Cele trei linii albe */
  .slash{
    opacity:0;
    transform: translate(-18px, 14px) scaleY(0.4);
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode:forwards;
    animation-timing-function: cubic-bezier(.2,1.4,.3,1);
    animation-duration: 0.7s;
  }
  #slash1{ animation-name: slashIn; animation-delay: 0.9s; }
  #slash2{ animation-name: slashIn; animation-delay: 1.05s; }
  #slash3{ animation-name: slashIn; animation-delay: 1.2s; }

  @keyframes slashIn{
    0%{ opacity:0; transform: translate(-18px, 14px) scaleY(0.3); }
    65%{ opacity:1; transform: translate(2px, -3px) scaleY(1.08); }
    100%{ opacity:1; transform: translate(0,0) scaleY(1); }
  }
</style>
</head>

<script>
  const logo = document.getElementById('logo');
  logo.addEventListener('click', () => {
    if (logo.classList.contains('spinning')) return; // ignoră click-uri repetate în timpul rotirii
    logo.classList.add('spinning');
  });
  logo.addEventListener('animationend', (e) => {
    if (e.animationName === 'loaderSpin') {
      logo.classList.remove('spinning');
    }
  });
</script>
