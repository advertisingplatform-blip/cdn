  <title>moment.ro</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --ink: #000;
      --muted: #666;
      --logo-size: min(60vmin, 460px);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0b0b0b;
        --ink: #fff;
        --muted: #999;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0b0b;
      --ink: #fff;
      --muted: #999;
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-family: "Poppins", "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .25s ease, color .25s ease;
    }
    main {
      min-height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      padding: 1.25rem;
    }
    #stage-svg {
      display: block;
      width: var(--logo-size);
      height: var(--logo-size);
      max-width: 88vw;
      max-height: 70vh;
      overflow: visible;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
    }
    #stage-svg:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 10px;
      border-radius: 18px;
    }
    #blob { transform-origin: 96px 145px; }
    .slash { transform-box: fill-box; transform-origin: center; }
    /* Animația originală de intrare a siglei Moment */
    #logo.enter #blob {
      opacity: 0;
      animation: blobIn 1s cubic-bezier(.2,1.6,.4,1) .1s forwards;
    }
    #logo.enter .slash {
      opacity: 0;
      transform: translate(-18px, 14px) scaleY(.4);
      animation-fill-mode: forwards;
      animation-timing-function: cubic-bezier(.2,1.4,.3,1);
      animation-duration: .7s;
    }
    #logo.enter #slash1 { animation-name: slashIn; animation-delay: .9s; }
    #logo.enter #slash2 { animation-name: slashIn; animation-delay: 1.05s; }
    #logo.enter #slash3 { animation-name: slashIn; animation-delay: 1.2s; }
    @keyframes blobIn {
      0% { opacity: 0; transform: scale(0) rotate(-25deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(4deg); }
      80% { transform: scale(.96) rotate(-2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes slashIn {
      0% { opacity: 0; transform: translate(-18px, 14px) scaleY(.3); }
      65% { opacity: 1; transform: translate(2px, -3px) scaleY(1.08); }
      100% { opacity: 1; transform: translate(0,0) scaleY(1); }
    }
    /* Repaus: forma originală a logo-ului */
    #logo.idle #blob { opacity: 1; transform: scale(1) rotate(0); }
    #logo.idle #slash1, #logo.idle #slash2, #logo.idle #slash3 {
      opacity: 1;
      transform: none;
    }
    /* La click, bula pulsează, iar cele trei linii sar ca pe un resort */
    #logo.pulsing #blob { animation: blobClickPulse 1s ease-out 1; }
    #logo.pulsing #slash1 { animation: springY1 1.1s cubic-bezier(.36,.07,.19,.97) 1; }
    #logo.pulsing #slash2 { animation: springY2 1.3s cubic-bezier(.36,.07,.19,.97) 1; }
    #logo.pulsing #slash3 { animation: springY3 1.5s cubic-bezier(.36,.07,.19,.97) 1; }
    @keyframes blobClickPulse {
      0% { transform: scale(1); }
      30% { transform: scale(1.16); }
      50% { transform: scale(.94); }
      68% { transform: scale(1.05); }
      83% { transform: scale(.98); }
      100% { transform: scale(1); }
    }
    @keyframes springY1 {
      0% { transform: translateY(0); } 14% { transform: translateY(-16px); }
      34% { transform: translateY(9px); } 54% { transform: translateY(-5px); }
      74% { transform: translateY(2.5px); } 90% { transform: translateY(-1px); }
      100% { transform: translateY(0); }
    }
    @keyframes springY2 {
      0% { transform: translateY(0); } 12% { transform: translateY(19px); }
      30% { transform: translateY(-11px); } 50% { transform: translateY(6px); }
      68% { transform: translateY(-3px); } 84% { transform: translateY(1.5px); }
      100% { transform: translateY(0); }
    }
    @keyframes springY3 {
      0% { transform: translateY(0); } 17% { transform: translateY(-21px); }
      38% { transform: translateY(12px); } 58% { transform: translateY(-6.5px); }
      76% { transform: translateY(3px); } 90% { transform: translateY(-1.5px); }
      100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

    <svg id="stage-svg" viewBox="15 55 180 180" xmlns="http://www.w3.org/2000/svg"
         role="button" tabindex="0" aria-label="moment.ro — apasă pentru animație">

  </main>
  <script>
    const logo = document.getElementById('logo');
    const stage = document.getElementById('stage-svg');
    let pulseBusy = false;

    // După animația inițială, păstrăm forma originală a siglei.
    window.setTimeout(() => {
      if (logo.classList.contains('enter')) {
        logo.classList.remove('enter');
        logo.classList.add('idle');
      }
    }, 2000);

    function pulseLogo() {
      if (!logo.classList.contains('idle') || pulseBusy) return;
      pulseBusy = true;
      logo.classList.remove('idle');
      logo.classList.add('pulsing');
    }
    stage.addEventListener('click', pulseLogo);
    stage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        pulseLogo();
      }
    });
    logo.addEventListener('animationend', (event) => {
      if (event.animationName === 'springY3') {
        logo.classList.remove('pulsing');
        logo.classList.add('idle');
        pulseBusy = false;
      }
    });
  </script>

</html>
